name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 카카오 키는 클라이언트 번들에 포함되는 공개 키입니다.
      # JS 키는 등록 도메인(localhost:5174, celine-kim0705.github.io)에서만 동작합니다.
      - run: npm run build
        env:
          VITE_KAKAO_JS_KEY: 014f43802878a00bd7457feb67428a26
          VITE_KAKAO_REST_KEY: ba4d0811a494c87a6590f0e35806cffc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
